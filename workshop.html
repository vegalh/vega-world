  <script>
    // mark JS early; arriving from the Atlas, the world opens out of its light
    (function (d) {
      d.className = d.className.replace("no-js", "js");
      try {
        var calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
        if (sessionStorage.getItem("vg-scene") && !calm) d.classList.add("from-world");
        sessionStorage.removeItem("vg-scene");
      } catch (e) {}
      // if the room never appears, its list of contents is the page
      setTimeout(function () {
        if (!d.classList.contains("stage-ready")) d.classList.add("no-webgl");
        d.classList.remove("from-world");
      }, 8000);
    })(document.documentElement);
  </script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>

  <script src="assets/js/site.js" defer></script>
  <script type="module" src="assets/js/workshop.js"></script>
